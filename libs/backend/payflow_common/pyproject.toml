[project]
name = "payflow-common"
version = "0.1.0"
description = "Shared PayFlow backend infrastructure"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["payflow_common"]

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
