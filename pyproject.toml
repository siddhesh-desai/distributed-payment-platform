[project]
name = "payflow"
version = "0.0.0"
description = "PayFlow monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend/api", "libs/backend/payflow_common"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["apps/backend", "libs/backend"]
pythonpath = ["apps/backend/api"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["apps/backend", "libs/backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["payflow_common", "core", "modules", "main"]
