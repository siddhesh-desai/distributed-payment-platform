[project]
name = "payflow"
version = "0.0.0"
description = "PayFlow monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["apps/backend", "libs/backend"]
pythonpath = []

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend", "libs/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
