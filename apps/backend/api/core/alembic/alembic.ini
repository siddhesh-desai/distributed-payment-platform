[alembic]
# This file lives next to env.py / script.py.mako.
script_location = %(here)s
# API package root on sys.path (core/, modules/).
prepend_sys_path = %(here)s/../..
# Append each modules/<name>/migrations (ADR-0004). `history`/`revision`
# read this; env.py also rediscovers dirs for upgrade.
version_locations = %(here)s/../../modules/sample_module/migrations
version_path_separator = os
# Filenames: 0001_slug.py (pass --rev-id 0002 on revision; keeps lexical sort).
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
