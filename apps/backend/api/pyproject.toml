[project]
name = "payflow-api"
version = "0.1.0"
description = "PayFlow product API (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "payflow-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules"]

[tool.uv.sources]
payflow-common = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["modules"]
python_files = ["test_*.py"]

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 100
target-version = "py312"
