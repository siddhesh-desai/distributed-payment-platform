services:
  postgres:
    image: postgres:16
    # Password and other secrets come only from gitignored `.env` (see `.env.example`).
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
    ports:
      - "5433:5432"
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-payflow} -d ${POSTGRES_DB:-payflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/backend/api/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${POSTGRES_POOL_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  payflow_pgdata:
